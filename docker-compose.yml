# Production stack for Coolify (build pack: Docker Compose) on the netcup VPS.
# All config comes from Coolify env vars — generate them with `pnpm coolify:env -- --domain <base-domain>`
# and paste setup-out/coolify.env into Coolify → Environment Variables → Developer view.
# Domains are assigned per service in the Coolify UI (api :3000, web :80, admin :80, media :80). No host ports.
# Postgres is NOT part of this stack: it runs as a separate Coolify Postgres resource (redeploys never touch it).
# api/worker join Coolify's shared `coolify` network to reach it; DATABASE_URL = the resource's internal URL.

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?}
  SEARCH_URL: http://searxng:8080
  # s3 = self-hosted Garage (separate Coolify service); local = the `media` volume (pre-migration only)
  MEDIA_DRIVER: ${MEDIA_DRIVER:-local}
  MEDIA_DIR: /media
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-garage}
  S3_BUCKET: ${S3_BUCKET:-wizzn-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  BETTER_AUTH_URL: ${API_PUBLIC_URL:?}
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  ADMIN_EMAILS: ${ADMIN_EMAILS:?}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434/v1}
  LLM_MODEL: ${LLM_MODEL:?}
  LLM_API_KEY: ${LLM_API_KEY:-}
  TTS_PROVIDER: ${TTS_PROVIDER:-silent}
  TTS_URL: ${TTS_URL:-http://localhost:5100/synthesize}
  TTS_VOICE: ${TTS_VOICE:-de_DE-thorsten-high}
  TTS_VOICE_1: ${TTS_VOICE_1:-}
  TTS_VOICE_2: ${TTS_VOICE_2:-}
  TTS_VOICE_3: ${TTS_VOICE_3:-}
  TTS_LENGTH_SCALE: ${TTS_LENGTH_SCALE:-1.2}
  TTS_INSTRUCTIONS: ${TTS_INSTRUCTIONS:-}
  REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
  REQUESTY_BASE_URL: ${REQUESTY_BASE_URL:-https://router.requesty.ai/v1}
  REQUESTY_TTS_MODEL: ${REQUESTY_TTS_MODEL:-openai/gpt-4o-mini-tts}
  REQUESTY_TTS_VOICE: ${REQUESTY_TTS_VOICE:-nova}
  REQUESTY_TTS_LANGUAGE: ${REQUESTY_TTS_LANGUAGE:-}
  REQUESTY_TTS_CHUNK_CHARS: ${REQUESTY_TTS_CHUNK_CHARS:-0}
  IMAGE_PROVIDER: ${IMAGE_PROVIDER:-placeholder}
  IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
  IMAGE_MODEL: ${IMAGE_MODEL:-}
  IMAGE_API_KEY: ${IMAGE_API_KEY:-}
  IMAGE_EPHEMERAL: ${IMAGE_EPHEMERAL:-true}
  STOCK_IMAGE_PROVIDERS: ${STOCK_IMAGE_PROVIDERS:-openverse,commons}
  STOCK_USER_AGENT: ${STOCK_USER_AGENT:?}
  OPENVERSE_CLIENT_ID: ${OPENVERSE_CLIENT_ID:-}
  OPENVERSE_CLIENT_SECRET: ${OPENVERSE_CLIENT_SECRET:-}
  STOCK_MIN_EDGE_PX: ${STOCK_MIN_EDGE_PX:-800}
  STOCK_MAX_BYTES: ${STOCK_MAX_BYTES:-5000000}
  RESEARCH_PROVIDERS: ${RESEARCH_PROVIDERS:-curated,wikipedia,europepmc,web}
  RESEARCH_MIN_SOURCES: ${RESEARCH_MIN_SOURCES:-2}
  FREE_DAILY_CAP: ${FREE_DAILY_CAP:-3}
  REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
  REVENUECAT_SECRET_KEY: ${REVENUECAT_SECRET_KEY:-}
  APPLE_APP_BUNDLE_ID: ${APPLE_APP_BUNDLE_ID:-app.fourki.wizzn}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  api:
    build: .
    restart: unless-stopped
    environment: *api-env
    volumes:
      - media:/media
    networks: [default, coolify]
    depends_on:
      searxng: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *api-env
    # The image HEALTHCHECK probes :3000, which only the api serves
    healthcheck:
      disable: true
    volumes:
      - media:/media
    networks: [default, coolify]
    depends_on:
      api: { condition: service_healthy }

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        API_URL: ${API_PUBLIC_URL:?}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_URL: ${API_PUBLIC_URL:?}
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    restart: unless-stopped

  # Legacy: serves the `media` volume until media.wizzn.app moves to Garage (docs/ops/media-storage.md, cutover).
  # Remove together with the `media` volume mounts once MEDIA_DRIVER=s3 is live.
  media:
    # Config is baked in: Coolify doesn't place repo files on the host, so file bind mounts break
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY deploy/media-nginx.conf /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    volumes:
      - media:/usr/share/nginx/html:ro

  # Nightly DB dump + media bucket → encrypted restic repo on Google Drive (docs/ops/media-storage.md)
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-rclone:gdrive:wizzn-backup}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      GDRIVE_TOKEN: ${GDRIVE_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-wizzn-media}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    volumes:
      - backup-mirror:/mirror
      - backup-cache:/cache
    networks: [default, coolify]

  searxng:
    build:
      context: .
      dockerfile_inline: |
        FROM searxng/searxng:latest
        COPY deploy/searxng/settings.yml /etc/searxng/settings.yml
    restart: unless-stopped
    environment:
      # Overrides server.secret_key from settings.yml
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}

volumes:
  media:
  backup-mirror:
  backup-cache:

networks:
  # Coolify's shared network; standalone databases are attached to it
  coolify:
    external: true
