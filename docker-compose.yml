# Production stack for Coolify on the netcup VPS. Secrets come from Coolify env vars.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.api
    environment:
      DATABASE_URL: postgres://wizzn:${POSTGRES_PASSWORD}@postgres:5432/wizzn
      SEARCH_URL: http://searxng:8080
      MEDIA_DIR: /media
    volumes:
      - media:/media
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env.api
    environment:
      DATABASE_URL: postgres://wizzn:${POSTGRES_PASSWORD}@postgres:5432/wizzn
      SEARCH_URL: http://searxng:8080
      MEDIA_DIR: /media
    volumes:
      - media:/media
    depends_on:
      api: { condition: service_healthy }

  media:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - media:/usr/share/nginx/html:ro
      - ./deploy/media-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wizzn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wizzn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizzn"]
      interval: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./deploy/searxng:/etc/searxng

volumes:
  pgdata:
  media:
