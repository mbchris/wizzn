# Local dev on the Mac: infra in Docker, api/worker via `pnpm dev`, LLM via Ollama on the host.
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: wizzn, POSTGRES_PASSWORD: wizzn, POSTGRES_DB: wizzn }
    ports: ["5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  searxng:
    image: searxng/searxng:latest
    ports: ["8080:8080"]
    volumes: [./deploy/searxng:/etc/searxng]
  media:
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    volumes:
      - ./packages/api/media-data:/usr/share/nginx/html:ro
      - ./deploy/media-nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  pgdata-dev:
